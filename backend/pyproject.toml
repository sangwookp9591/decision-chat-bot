[project]
name = "ildongi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "neo4j>=5.25,<7",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.15.1,<3",
  "python-multipart>=0.0.12,<1",
  "typesafe-sdk==0.7.2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "redis>=5.2,<7",
  "anthropic>=1.11,<2",
  "openai>=3.24,<4",
  "google-genai>=2.28,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2", "reportlab>=4,<5", "import-linter>=2,<3"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ildongi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.importlinter]
root_package = "ildongi"

[[tool.importlinter.contracts]]
name = "Feature API to service to store"
type = "layers"
containers = ["ildongi.auth", "ildongi.review", "ildongi.judgment", "ildongi.ingest", "ildongi.tasks", "ildongi.observe", "ildongi.graph", "ildongi.monitoring", "ildongi.learning", "ildongi.evaluation", "ildongi.assist", "ildongi.mcp_server"]
layers = ["(api)", "(service)", "(store)"]

[[tool.importlinter.contracts]]
name = "Policy and persistence to domain"
type = "layers"
layers = ["ildongi.policy", "ildongi.db", "ildongi.domain"]
ignore_imports = [
  # Legacy start_run_in_tx import is public to integration callers; migrate with API versioning.
  "ildongi.domain.runs -> ildongi.db.runs",
]

[[tool.importlinter.contracts]]
name = "Graph and monitoring are independent"
type = "independence"
modules = ["ildongi.graph", "ildongi.monitoring"]

[[tool.importlinter.contracts]]
name = "Judgment may call review but review is independent"
type = "layers"
layers = ["ildongi.judgment", "ildongi.review"]

[[tool.importlinter.contracts]]
name = "Learning may use judgment and policy"
type = "layers"
layers = ["ildongi.learning", "ildongi.judgment", "ildongi.policy"]

[[tool.importlinter.contracts]]
name = "Top-level feature imports are acyclic"
type = "acyclic_siblings"
ancestors = ["ildongi"]
depth = 10
ignore_imports = [
  # Compatibility path for existing callers of domain.runs.start_run_in_tx.
  "ildongi.domain.runs -> ildongi.db.runs",
]

[[tool.importlinter.contracts]]
name = "Assist cannot decide or publish policy"
type = "forbidden"
source_modules = ["ildongi.assist"]
forbidden_modules = ["ildongi.judgment", "ildongi.learning", "ildongi.review", "ildongi.policy"]

[[tool.importlinter.contracts]]
name = "MCP uses public services and never persistence or HTTP feature handlers"
type = "forbidden"
source_modules = ["ildongi.mcp_server"]
forbidden_modules = ["ildongi.db", "ildongi.ingest.store", "ildongi.judgment.store", "ildongi.judgment.progress_store", "ildongi.review.store", "ildongi.tasks.store", "ildongi.auth.store", "ildongi.ingest.api", "ildongi.judgment.api", "ildongi.review.api", "ildongi.tasks.api"]
allow_indirect_imports = true
